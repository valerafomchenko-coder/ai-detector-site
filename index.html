<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI</title>

<style>
:root{
    --bg:#0b1220;
    --card:#111a2e;
    --text:#ffffff;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --danger:#ef4444;
    --green:#22c55e;
    --yellow:#f59e0b;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

h1{
    font-size:34px;
    margin:0;
}

.small{
    color:var(--muted);
    font-size:14px;
}

.lang{
    background:#334155;
    border:none;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

textarea{
    width:100%;
    height:180px;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:none;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    outline:none;
}

.panel{
    display:flex;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#334155;
    color:white;
    font-size:14px;
}

button.primary{
    background:var(--primary);
}

button.danger{
    background:var(--danger);
}

.card{
    margin-top:20px;
    padding:20px;
    background:var(--card);
    border-radius:12px;
}

.bar{
    height:10px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:10px;
    width:0%;
    background:var(--green);
    transition:0.3s;
}

.split{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.box{
    background:rgba(255,255,255,0.05);
    padding:10px;
    border-radius:10px;
    font-size:13px;
    white-space:pre-wrap;
}

.insights{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div>
        <h1 id="title">Humanly AI</h1>
        <div class="small" id="subtitle">AI writing assistant</div>
    </div>

    <button class="lang" onclick="toggleLang()" id="langBtn">EN</button>
</div>

<textarea id="text" placeholder="Paste text..."></textarea>

<div class="panel">
    <button class="primary" onclick="improve()">✨ Improve Text</button>
    <button onclick="detect()">Detect AI</button>
    <button onclick="copyText()">Copy</button>
    <button onclick="clearText()" class="danger">Clear</button>
</div>

<div class="card" id="resultCard" style="display:none;">

    <h2 id="resultTitle"></h2>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="split" id="split" style="display:none;">
        <div class="box" id="before"></div>
        <div class="box" id="after"></div>
    </div>

    <div class="insights" id="insights"></div>
</div>

</div>

<script>

let lang = "ru";
const textEl = document.getElementById("text");

const T = {
    ru:{
        subtitle:"AI помощник для улучшения текста",
        improve:"Улучшить текст",
        detect:"Проверка на ИИ",
        copy:"Скопировано",
        clear:"Очищено",
        placeholder:"Вставь текст...",
        no:"Нет явных AI признаков"
    },
    en:{
        subtitle:"AI writing assistant",
        improve:"Improve Text",
        detect:"AI Detection",
        copy:"Copied",
        clear:"Cleared",
        placeholder:"Paste text...",
        no:"No strong AI signals"
    }
};

function toggleLang(){

    lang = lang === "ru" ? "en" : "ru";

    document.getElementById("subtitle").innerText = T[lang].subtitle;
    document.getElementById("text").placeholder = T[lang].placeholder;

    document.querySelector(".primary").innerText = "✨ " + T[lang].improve;
    document.querySelectorAll("button")[1].innerText = T[lang].detect;

}

function clearText(){
    textEl.value = "";
    document.getElementById("resultCard").style.display = "none";
}

function copyText(){
    navigator.clipboard.writeText(textEl.value);
    alert(T[lang].copy);
}

function detect(){

    let text = textEl.value;
    if(text.length < 5) return;

    let score = 50;
    let reasons = [];

    let lower = text.toLowerCase();

    ["however","moreover","furthermore"].forEach(w=>{
        if(lower.includes(w)){
            score += 10;
            reasons.push(w);
        }
    });

    let words = lower.split(/\s+/);
    let unique = new Set(words);

    if(unique.size / words.length < 0.55){
        score += 15;
        reasons.push("repetition");
    }

    score = Math.max(5, Math.min(95, Math.round(score)));

    showResult("AI Score", score + "%", reasons);
}

function improve(){

    let text = textEl.value;
    if(text.length < 5) return;

    let improved = text
        .replace(/however/gi,"но")
        .replace(/moreover/gi,"и к тому же")
        .replace(/furthermore/gi,"и ещё");

    showSplit("Improved Text", text, improved);
}

function showResult(title, value, reasons){

    let card = document.getElementById("resultCard");
    card.style.display = "block";

    document.getElementById("split").style.display = "none";

    document.getElementById("resultTitle").innerText = title;
    document.getElementById("fill").style.width = parseInt(value) + "%";

    document.getElementById("insights").innerText =
        reasons.length ? reasons.join(", ") : T[lang].no;
}

function showSplit(title, before, after){

    let card = document.getElementById("resultCard");
    card.style.display = "block";

    document.getElementById("resultTitle").innerText = title;

    document.getElementById("split").style.display = "grid";
    document.getElementById("before").innerText = before;
    document.getElementById("after").innerText = after;

    document.getElementById("fill").style.width = "100%";
    document.getElementById("insights").innerText = "";
}

</script>

</body>
</html>
