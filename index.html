<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Detector SaaS</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

textarea {
  width: 100%;
  height: 160px;
  margin-top: 15px;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  margin: 5px 5px 0 0;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.primary { background:#3b82f6; color:white; }
.gray { background:#374151; color:white; }

.card {
  background:#111827;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

#result {
  margin-top: 10px;
  font-size: 18px;
}

.lang {
  background:#1f2937;
  color:white;
}

.history-item {
  background:#1f2937;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2 id="title">AI Detector</h2>

<select class="lang" onchange="setLang(this.value)">
  <option value="ru">RU</option>
  <option value="en">EN</option>
</select>
</div>

<div class="card">

<textarea id="text"></textarea>

<br>

<button class="primary" onclick="detect()">Проверить текст</button>
<button class="primary" onclick="humanize()">Очеловечить</button>
<button class="gray" onclick="clearText()">Очистить</button>
<button class="gray" onclick="copyText()">Копировать</button>

<div id="result"></div>

</div>

<div class="card">
<h3>История</h3>
<div id="history"></div>
</div>

</div>

<script>

const API = "http://2.26.31.163:3000";

let lang = "ru";
let history = JSON.parse(localStorage.getItem("history") || "[]");

const dict = {
  ru: {
    title: "AI Детектор",
    detect: "Проверить текст",
    humanize: "Очеловечить",
    clear: "Очистить",
    copy: "Копировать"
  },
  en: {
    title: "AI Detector",
    detect: "Detect text",
    humanize: "Humanize",
    clear: "Clear",
    copy: "Copy"
  }
};

function setLang(l) {
  lang = l;
  document.getElementById("title").innerText = dict[l].title;
}

function save(text, result) {
  history.unshift({ text, result });
  history = history.slice(0, 10);
  localStorage.setItem("history", JSON.stringify(history));
  render();
}

function render() {
  const box = document.getElementById("history");
  box.innerHTML = "";

  history.forEach(h => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerText = h.text.slice(0, 60) + " → " + h.result;
    div.onclick = () => document.getElementById("text").value = h.text;
    box.appendChild(div);
  });
}

function scoreLabel(s) {
  if (s < 40) return "LOW AI";
  if (s < 70) return "MEDIUM AI";
  return "HIGH AI";
}

async function detect() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/detect", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  const label = scoreLabel(data.score);
  document.getElementById("result").innerText = label + " (" + data.score + ")";
  save(text, label);
}

async function humanize() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/humanize", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  document.getElementById("result").innerText = data.result;
  save(text, "humanized");
}

function clearText() {
  document.getElementById("text").value = "";
  document.getElementById("result").innerText = "";
}

function copyText() {
  navigator.clipboard.writeText(document.getElementById("result").innerText);
}

render();

</script>

</body>
</html>
