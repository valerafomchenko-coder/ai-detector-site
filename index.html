<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI SaaS Detector</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

textarea {
  width: 100%;
  height: 160px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 14px;
  margin: 5px 5px 0 0;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.primary { background: #3b82f6; color: white; }
.gray { background: #374151; color: white; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#result {
  margin-top: 15px;
  font-size: 18px;
  white-space: pre-wrap;
}

.history-item {
  background: #1f2937;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}
</style>

</head>

<body>

<div class="container">

<div class="topbar">
  <h2>AI SaaS Detector</h2>
</div>

<div class="card">

<textarea id="text"></textarea>

<br>

<button class="primary" onclick="detect()">Проверить текст</button>
<button class="primary" onclick="humanize()">Очеловечить</button>
<button class="gray" onclick="clearText()">Очистить</button>

<div id="result"></div>

</div>

<div class="card">
<h3>История</h3>
<div id="history"></div>
</div>

</div>

<script>

const API = "/api";

let history = JSON.parse(localStorage.getItem("history") || "[]");

function saveHistory(text, result) {
  history.unshift({ text, result });
  history = history.slice(0, 10);
  localStorage.setItem("history", JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById("history");
  box.innerHTML = "";

  history.forEach(h => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerText = h.text.slice(0, 60) + " → " + h.result;
    div.onclick = () => {
      document.getElementById("text").value = h.text;
    };
    box.appendChild(div);
  });
}

function scoreLabel(score) {
  if (score < 40) return "Низкий AI";
  if (score < 70) return "Средний AI";
  return "Высокий AI";
}

async function detect() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/detect", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  const label = scoreLabel(data.score);

  const result = `${label} (${data.score})`;

  document.getElementById("result").innerText = result;

  saveHistory(text, result);
}

async function humanize() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/humanize", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  document.getElementById("result").innerText = data.result;

  saveHistory(text, "humanized");
}

function clearText() {
  document.getElementById("text").value = "";
  document.getElementById("result").innerText = "";
}

renderHistory();

</script>

</body>
</html>
