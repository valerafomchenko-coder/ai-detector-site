<<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI SaaS Detector</title>
<style>
body { font-family: Arial; padding: 20px; background: #f6f6f6; }
textarea { width: 100%; height: 160px; padding: 10px; }
button { margin: 5px; padding: 10px 15px; cursor: pointer; }
#result { margin-top: 20px; font-weight: bold; white-space: pre-wrap; }
.container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
</style>
</head>

<body>
<div class="container">

<h2>AI Detector SaaS</h2>

<textarea id="text"></textarea>

<br>

<button onclick="detect()">Проверить текст</button>
<button onclick="humanize()">Очеловечить текст</button>
<button onclick="clearText()">Очистить</button>

<div id="result"></div>

</div>

<script>
const API = "/api";

async function detect() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/detect", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  document.getElementById("result").innerText =
    "AI SCORE: " + data.score;
}

async function humanize() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/humanize", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ text })
  });

  const data = await res.json();
  document.getElementById("result").innerText =
    data.result;
}

function clearText() {
  document.getElementById("text").value = "";
  document.getElementById("result").innerText = "";
}
</script>

</body>
</html>
