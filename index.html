<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

h1 {
    font-size: 40px;
}

textarea {
    width: 100%;
    height: 180px;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 16px;
}

button {
    margin: 6px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.card {
    margin-top: 20px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
    text-align: left;
}

.small {
    color: #94a3b8;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title"></h1>
<p class="small" id="subtitle"></p>

<div>
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
</div>

<textarea id="text"></textarea>

<div class="small" id="counter"></div>

<br/>

<button onclick="detect()" id="btnDetect"></button>
<button onclick="humanize()" id="btnHumanize"></button>
<button onclick="clearText()" id="btnClear"></button>
<button onclick="copyText()" id="btnCopy"></button>

<div class="card" id="resultCard" style="display:none;">
    <h3 id="resultTitle"></h3>
    <p id="resultText"></p>
</div>

</div>

<script>

let lang = "ru";

const dict = {
    ru: {
        title: "Humanly AI",
        subtitle: "Детектор и очеловечивание текста",
        detect: "Проверить текст",
        humanize: "Очеловечить текст",
        clear: "Очистить",
        copy: "Копировать результат",
        chars: "Символов",
        words: "Слов",
        aiScore: "Оценка ИИ",
        humanized: "Переписанный текст",
        placeholder: "Вставьте текст сюда..."
    },
    en: {
        title: "Humanly AI",
        subtitle: "AI Detector and Humanizer",
        detect: "Analyze text",
        humanize: "Humanize text",
        clear: "Clear",
        copy: "Copy result",
        chars: "Characters",
        words: "Words",
        aiScore: "AI Score",
        humanized: "Humanized text",
        placeholder: "Paste your text here..."
    }
};

const textarea = document.getElementById("text");

textarea.addEventListener("input", updateCounter);

function setLang(l){
    lang = l;
    const d = dict[lang];

    document.getElementById("title").innerText = d.title;
    document.getElementById("subtitle").innerText = d.subtitle;

    document.getElementById("btnDetect").innerText = d.detect;
    document.getElementById("btnHumanize").innerText = d.humanize;
    document.getElementById("btnClear").innerText = d.clear;
    document.getElementById("btnCopy").innerText = d.copy;

    textarea.placeholder = d.placeholder;

    updateCounter();
}

function updateCounter(){
    let text = textarea.value;
    let chars = text.length;
    let words = text.trim().split(/\s+/).filter(Boolean).length;

    const d = dict[lang];

    document.getElementById("counter").innerText =
        `${d.chars}: ${chars} | ${d.words}: ${words}`;
}

function detect(){
    fetch("http://2.26.31.163:3000/detect", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: textarea.value})
    })
    .then(r => r.json())
    .then(data => {
        show(dict[lang].aiScore, data.score + "%");
    });
}

function humanize(){
    fetch("http://2.26.31.163:3000/humanize", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: textarea.value})
    })
    .then(r => r.json())
    .then(data => {
        show(dict[lang].humanized, data.result);
    });
}

function show(title, text){
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("resultTitle").innerText = title;
    document.getElementById("resultText").innerText = text;
}

function clearText(){
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
    updateCounter();
}

function copyText(){
    navigator.clipboard.writeText(
        document.getElementById("resultText").innerText
    );
}

// init
setLang("ru");

</script>

</body>
</html>
