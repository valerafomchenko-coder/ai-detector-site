<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI 3.5</title>

<style>
:root{
    --bg:#0b1220;
    --card:#111a2e;
    --text:#ffffff;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --danger:#ef4444;
    --green:#22c55e;
    --yellow:#f59e0b;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    font-size:38px;
    margin-bottom:5px;
}

.small{
    color:var(--muted);
    font-size:14px;
}

textarea{
    width:100%;
    height:180px;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:none;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    outline:none;
}

.panel{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#334155;
    color:white;
    font-size:14px;
    transition:0.2s;
}

button.active{
    background:var(--primary);
}

button.danger{ background:var(--danger); }

.card{
    margin-top:20px;
    padding:20px;
    background:var(--card);
    border-radius:12px;
}

.bar{
    height:10px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:10px;
    width:0%;
    background:var(--green);
    transition:0.4s;
}

.insights{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:rgba(148,163,184,0.1);
    font-size:14px;
    color:var(--muted);
}
</style>
</head>

<body>

<div class="container">

<h1>Humanly AI 3.5</h1>
<div class="small">AI Text Tool — Detect • Humanize • Improve</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<div class="panel">
    <button id="b1" onclick="setMode('detect', this)">Detect AI</button>
    <button id="b2" onclick="setMode('humanize', this)">Humanize</button>
    <button id="b3" onclick="setMode('improve', this)">Improve</button>
    <button class="danger" onclick="clearText()">Clear</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="title"></h2>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="result"></p>
    <div class="insights" id="insights"></div>
</div>

</div>

<script>

let mode = "detect";
const textarea = document.getElementById("text");

function setMode(m, el){

    mode = m;

    document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
    el.classList.add("active");

    run();
}

function clearText(){
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
}

function analyze(text){

    let score = 50;
    let reasons = [];

    let lower = text.toLowerCase();

    const ai = ["however","moreover","furthermore","in conclusion"];

    ai.forEach(w=>{
        if(lower.includes(w)){
            score += 10;
            reasons.push("AI phrase: " + w);
        }
    });

    let words = lower.split(/\s+/);
    let unique = new Set(words);

    let diversity = unique.size / words.length;

    if(diversity < 0.55){
        score += 15;
        reasons.push("Repetition detected");
    }

    let avg = text.length / (text.split(".").length || 1);

    if(avg > 120){
        score += 10;
        reasons.push("Long sentences");
    }

    score = Math.max(5, Math.min(95, Math.round(score)));

    return {score, reasons};
}

function humanize(text){

    return text
        .replace(/however/gi,"но")
        .replace(/moreover/gi,"к тому же")
        .replace(/furthermore/gi,"и ещё")
        .replace(/in conclusion/gi,"в итоге");
}

function improve(text){

    return text
        .replace(/however/gi,"но")
        .replace(/moreover/gi,"к тому же")
        .replace(/furthermore/gi,"и ещё")
        .replace(/in conclusion/gi,"в итоге")
        + "\n\n(улучшено по стилю)";
}

function run(){

    let text = textarea.value;
    if(text.length < 5) return;

    let resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";

    let title = document.getElementById("title");
    let result = document.getElementById("result");
    let fill = document.getElementById("fill");
    let insights = document.getElementById("insights");

    if(mode === "detect"){

        let r = analyze(text);

        title.innerText = "AI Score";
        result.innerText = r.score + "% AI-like";

        fill.style.width = r.score + "%";
        fill.style.background = r.score > 70 ? "var(--danger)" : "var(--green)";

        insights.innerHTML = r.reasons.length
            ? "• " + r.reasons.join("<br>• ")
            : "No strong AI signals";
    }

    if(mode === "humanize"){

        let out = humanize(text);

        title.innerText = "Humanized Text";
        result.innerText = out;

        fill.style.width = "100%";
        fill.style.background = "var(--yellow)";

        insights.innerHTML = "Simplified & made more natural";
    }

    if(mode === "improve"){

        let out = improve(text);

        title.innerText = "Improved Text";
        result.innerText = out;

        fill.style.width = "100%";
        fill.style.background = "var(--primary)";

        insights.innerHTML = "Style optimized + AI markers reduced";
    }
}

document.getElementById("b1").classList.add("active");

</script>

</body>
</html>
