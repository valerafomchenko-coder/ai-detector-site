<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI 3.2</title>

<style>
:root{
    --bg:#0b1220;
    --card:#111a2e;
    --text:#ffffff;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --danger:#ef4444;
    --green:#22c55e;
}

body.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#475569;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    font-size:40px;
    margin-bottom:5px;
}

.small{
    color:var(--muted);
    font-size:14px;
}

textarea{
    width:100%;
    height:180px;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:none;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    outline:none;
    resize:none;
}

.panel{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:var(--primary);
    color:white;
    font-size:14px;
}

button.secondary{ background:#334155; }
button.danger{ background:var(--danger); }

.card{
    margin-top:20px;
    padding:20px;
    background:var(--card);
    border-radius:12px;
}

.bar{
    height:10px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:10px;
    width:0%;
    background:var(--green);
    transition:0.4s;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    opacity:0;
    transition:0.3s;
}
.toast.show{ opacity:1; }

.lang{
    margin-left:10px;
    background:#334155;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <div>
        <h1 id="title">Humanly AI 3.2</h1>
        <div class="small" id="subtitle">AI Detector + Humanizer</div>
    </div>

    <div>
        <button class="secondary" onclick="toggleTheme()">🌙</button>
        <button class="lang" onclick="toggleLang()" id="langBtn">EN</button>
    </div>
</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<div class="small" id="counter">0 символов | 0 слов</div>

<div class="panel">
    <button onclick="run()" id="btnAnalyze">Analyze</button>
    <button class="danger" onclick="clearText()" id="btnClear">Очистить</button>
    <button class="secondary" onclick="copyResult()" id="btnCopy">Копировать</button>
    <button class="secondary" onclick="pasteText()" id="btnPaste">Вставить</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="resultTitle"></h2>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="resultText"></p>
</div>

</div>

<div class="toast" id="toast">OK</div>

<script>

let lang = "ru";
const textarea = document.getElementById("text");

textarea.addEventListener("input", updateCounter);

const t = {
    ru:{
        placeholder:"Вставь текст...",
        analyze:"Анализ",
        clear:"Очистить",
        copy:"Копировать",
        paste:"Вставить",
        result:"AI вероятность",
        toastCopy:"Скопировано",
        toastClear:"Очищено",
        toastPaste:"Вставлено",
        counter:(c,w)=>`${c} символов | ${w} слов`,
        subtitle:"AI Detector + Humanizer"
    },
    en:{
        placeholder:"Paste text...",
        analyze:"Analyze",
        clear:"Clear",
        copy:"Copy",
        paste:"Paste",
        result:"AI Score",
        toastCopy:"Copied",
        toastClear:"Cleared",
        toastPaste:"Pasted",
        counter:(c,w)=>`${c} chars | ${w} words`,
        subtitle:"AI Detector + Humanizer Tool"
    }
};

function setUI(){
    textarea.placeholder = t[lang].placeholder;
    document.getElementById("btnAnalyze").innerText = t[lang].analyze;
    document.getElementById("btnClear").innerText = t[lang].clear;
    document.getElementById("btnCopy").innerText = t[lang].copy;
    document.getElementById("btnPaste").innerText = t[lang].paste;
    document.getElementById("subtitle").innerText = t[lang].subtitle;
}

function toggleLang(){
    lang = lang === "ru" ? "en" : "ru";
    document.getElementById("langBtn").innerText = lang === "ru" ? "EN" : "RU";
    setUI();
    updateCounter();
}

function updateCounter(){
    let text = textarea.value;
    let chars = text.length;
    let words = text.trim() ? text.trim().split(/\s+/).length : 0;

    document.getElementById("counter").innerText =
        t[lang].counter(chars, words);
}

function showToast(msg){
    let toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1500);
}

function clearText(){
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
    updateCounter();
    showToast(t[lang].toastClear);
}

function copyResult(){
    let text = document.getElementById("resultText").innerText;
    navigator.clipboard.writeText(text);
    showToast(t[lang].toastCopy);
}

function pasteText(){
    navigator.clipboard.readText().then(txt=>{
        textarea.value = txt;
        updateCounter();
        showToast(t[lang].toastPaste);
    });
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

function analyze(text){
    let score = 50;

    const bad = ["however","moreover","in conclusion","furthermore"];

    bad.forEach(p=>{
        if(text.toLowerCase().includes(p)) score += 8;
    });

    let words = text.toLowerCase().split(/\s+/);
    let unique = new Set(words);

    let diversity = unique.size / words.length;

    if(diversity < 0.55) score += 15;

    let avg = text.length / (text.split(".").length || 1);
    if(avg > 120) score += 10;

    return Math.max(5, Math.min(95, Math.round(score)));
}

function run(){
    let text = textarea.value;
    if(text.length < 10) return;

    let score = analyze(text);

    document.getElementById("resultCard").style.display = "block";
    document.getElementById("resultTitle").innerText = t[lang].result;

    document.getElementById("resultText").innerText = score + "% AI-like";

    let fill = document.getElementById("fill");
    fill.style.width = score + "%";
    fill.style.background = score > 70 ? "var(--danger)" : "var(--green)";
}

setUI();
updateCounter();

</script>

</body>
</html>
