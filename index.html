<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI Tool</title>

<style>
body { margin:0; font-family:Arial; background:#0f172a; color:white; }
.container { max-width:900px; margin:auto; padding:25px; }
.header { display:flex; justify-content:space-between; align-items:center; }

textarea { width:100%; height:160px; margin-top:15px; padding:10px; }
button { margin:5px; padding:10px 14px; border-radius:8px; border:none; cursor:pointer; }

.primary { background:#3b82f6; color:white; }
.gray { background:#374151; color:white; }

.card { background:#111827; padding:15px; border-radius:12px; margin-top:15px; }

#result { margin-top:10px; font-size:18px; }

.lang { background:#1f2937; color:white; padding:5px; }
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2 id="title">AI Tool</h2>

<select class="lang" onchange="setLang(this.value)">
  <option value="ru">RU</option>
  <option value="en">EN</option>
</select>
</div>

<div class="card">

<textarea id="text"></textarea>

<br>

<button id="btnDetect" class="primary" onclick="detect()"></button>
<button id="btnHumanize" class="primary" onclick="humanize()"></button>
<button id="btnClear" class="gray" onclick="clearText()"></button>
<button id="btnCopy" class="gray" onclick="copyText()"></button>

<div id="result"></div>

</div>

</div>

<script>

const API = "http://2.26.31.163:3000";

let lang = "ru";

const dict = {
  ru: {
    title: "AI Детектор",
    detect: "Проверить текст",
    humanize: "Очеловечить",
    clear: "Очистить",
    copy: "Копировать"
  },
  en: {
    title: "AI Tool",
    detect: "Detect text",
    humanize: "Humanize",
    clear: "Clear",
    copy: "Copy"
  }
};

function setLang(l) {
  lang = l;

  document.getElementById("title").innerText = dict[l].title;

  document.getElementById("btnDetect").innerText = dict[l].detect;
  document.getElementById("btnHumanize").innerText = dict[l].humanize;
  document.getElementById("btnClear").innerText = dict[l].clear;
  document.getElementById("btnCopy").innerText = dict[l].copy;
}

async function detect() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/detect", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  document.getElementById("result").innerText =
    (data.score < 40 ? "LOW AI" : data.score < 70 ? "MID AI" : "HIGH AI")
    + " (" + data.score + ")";
}

async function humanize() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/humanize", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  document.getElementById("result").innerText = data.result;
}

function clearText() {
  document.getElementById("text").value = "";
  document.getElementById("result").innerText = "";
}

function copyText() {
  navigator.clipboard.writeText(document.getElementById("result").innerText);
}

setLang("ru");

</script>

</body>
</html>
