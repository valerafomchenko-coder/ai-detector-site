<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Humanly AI 3.0</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

h1 {
    font-size: 42px;
}

textarea {
    width: 100%;
    height: 180px;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    margin-top: 15px;
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.card {
    margin-top: 20px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
}

.small {
    color: #94a3b8;
    font-size: 14px;
}

.bar {
    height: 10px;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.fill {
    height: 10px;
    width: 0%;
    background: #22c55e;
    transition: 0.4s;
}

.tabs {
    margin-top: 20px;
}

.tab {
    display: inline-block;
    padding: 10px 15px;
    margin: 5px;
    background: #1e293b;
    border-radius: 8px;
    cursor: pointer;
}

.tab.active {
    background: #3b82f6;
}
</style>
</head>

<body>

<div class="container">

<h1>Humanly AI 3.0</h1>
<p class="small">AI Text Detector + Humanizer</p>

<div class="tabs">
    <div class="tab active" onclick="setMode('detect')">Detect AI</div>
    <div class="tab" onclick="setMode('humanize')">Humanize</div>
</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<br/>

<button onclick="run()">Analyze</button>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="resultTitle"></h2>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="resultText"></p>
</div>

</div>

<script>

let mode = "detect";

function setMode(m) {
    mode = m;

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");
}

function analyzeText(text) {

    let score = 50;

    // AI-паттерны
    const aiPhrases = [
        "however", "moreover", "in conclusion",
        "it is important to note", "furthermore"
    ];

    aiPhrases.forEach(p => {
        if (text.toLowerCase().includes(p)) score += 8;
    });

    // длина предложений
    let sentences = text.split(".");
    let avgLen = text.length / (sentences.length || 1);

    if (avgLen > 120) score += 10;
    if (avgLen < 40) score -= 5;

    // повторяемость слов
    let words = text.toLowerCase().split(/\s+/);
    let unique = new Set(words);
    let diversity = unique.size / words.length;

    if (diversity < 0.55) score += 15;

    if (score > 95) score = 95;
    if (score < 5) score = 5;

    return Math.round(score);
}

function humanizeText(text) {

    return text
        .replace(/however/gi, "но")
        .replace(/moreover/gi, "к тому же")
        .replace(/in conclusion/gi, "в итоге")
        .replace(/it is important to note/gi, "важно понимать что")
        .replace(/furthermore/gi, "и ещё")
        + "\n\n(переписано в более естественном стиле)";
}

function run() {

    let text = document.getElementById("text").value;

    if (text.length < 10) return;

    let resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";

    if (mode === "detect") {

        let score = analyzeText(text);

        document.getElementById("resultTitle").innerText = "AI Probability";
        document.getElementById("resultText").innerText = score + "% AI-like text";

        document.getElementById("fill").style.width = score + "%";
        document.getElementById("fill").style.background = score > 70 ? "#ef4444" : "#22c55e";
    }

    if (mode === "humanize") {

        let result = humanizeText(text);

        document.getElementById("resultTitle").innerText = "Humanized Text";
        document.getElementById("resultText").innerText = result;

        document.getElementById("fill").style.width = "100%";
        document.getElementById("fill").style.background = "#3b82f6";
    }
}

</script>

</body>
</html>
