<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI 3.6</title>

<style>
:root{
    --bg:#0b1220;
    --card:#111a2e;
    --text:#ffffff;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --danger:#ef4444;
    --green:#22c55e;
    --yellow:#f59e0b;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    font-size:38px;
    margin-bottom:5px;
}

.small{
    color:var(--muted);
    font-size:14px;
}

textarea{
    width:100%;
    height:180px;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:none;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    outline:none;
}

.panel{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:12px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#334155;
    color:white;
    font-size:14px;
}

button.active{ background:var(--primary); }
button.danger{ background:var(--danger); }

.card{
    margin-top:20px;
    padding:20px;
    background:var(--card);
    border-radius:12px;
}

.bar{
    height:10px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:10px;
    width:0%;
    background:var(--green);
    transition:0.4s;
}

.insights{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:rgba(148,163,184,0.1);
    font-size:14px;
    color:var(--muted);
}

.split{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.box{
    background:rgba(255,255,255,0.05);
    padding:10px;
    border-radius:10px;
    font-size:13px;
    white-space:pre-wrap;
}

.history{
    margin-top:20px;
    font-size:13px;
    color:var(--muted);
}
</style>
</head>

<body>

<div class="container">

<h1>Humanly AI 3.6</h1>
<div class="small">AI Tool — Detect • Humanize • Improve • History</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<div class="panel">
    <button onclick="run('detect', this)" id="b1">Detect</button>
    <button onclick="run('humanize', this)" id="b2">Humanize</button>
    <button onclick="run('improve', this)" id="b3">Improve</button>
    <button class="danger" onclick="clearText()">Clear</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="title"></h2>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="split" id="split" style="display:none;">
        <div class="box" id="before"></div>
        <div class="box" id="after"></div>
    </div>

    <p id="result"></p>
    <div class="insights" id="insights"></div>
</div>

<div class="history" id="history">
<b>History:</b><br/>
</div>

</div>

<script>

const textarea = document.getElementById("text");
let history = [];
let lastMode = "detect";
let timer = null;

textarea.addEventListener("input", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
        if(textarea.value.length > 5){
            run(lastMode);
        }
    }, 600);
});

function clearText(){
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
}

function analyze(text){

    let score = 50;
    let reasons = [];

    let lower = text.toLowerCase();

    const ai = ["however","moreover","furthermore","in conclusion"];

    ai.forEach(w=>{
        if(lower.includes(w)){
            score += 10;
            reasons.push(w);
        }
    });

    let words = lower.split(/\s+/);
    let unique = new Set(words);

    if(unique.size / words.length < 0.55){
        score += 15;
        reasons.push("repetition");
    }

    score = Math.max(5, Math.min(95, Math.round(score)));

    return {score, reasons};
}

/* 🧠 improved humanizer */
function humanize(text){
    return text
        .replace(/however/gi,"но")
        .replace(/moreover/gi,"и к тому же")
        .replace(/furthermore/gi,"плюс")
        .replace(/in conclusion/gi,"в итоге");
}

function improve(text){

    return text
        .split(".")
        .map(s=>s.trim())
        .filter(Boolean)
        .map(s=>{
            if(s.length > 80) return s.replace(/however/gi,"но");
            return s;
        })
        .join(". ") + ".";
}

/* 📊 history */
function addHistory(mode, result){
    history.unshift(mode + " → " + result);
    history = history.slice(0,5);

    document.getElementById("history").innerHTML =
        "<b>History:</b><br/>" + history.join("<br/>");
}

function run(mode){

    lastMode = mode;

    let text = textarea.value;
    if(text.length < 5) return;

    let card = document.getElementById("resultCard");
    card.style.display = "block";

    let title = document.getElementById("title");
    let result = document.getElementById("result");
    let fill = document.getElementById("fill");

    let split = document.getElementById("split");
    let before = document.getElementById("before");
    let after = document.getElementById("after");

    split.style.display = "none";

    if(mode === "detect"){

        let r = analyze(text);

        title.innerText = "AI Score";
        result.innerText = r.score + "% AI-like";

        fill.style.width = r.score + "%";
        fill.style.background = r.score > 70 ? "#ef4444" : "#22c55e";

        addHistory("Detect", r.score + "%");
    }

    if(mode === "humanize"){

        let out = humanize(text);

        title.innerText = "Humanized";

        split.style.display = "grid";
        before.innerText = text;
        after.innerText = out;

        fill.style.width = "100%";
        fill.style.background = "#f59e0b";

        addHistory("Humanize", "done");
    }

    if(mode === "improve"){

        let out = improve(text);

        title.innerText = "Improved";

        split.style.display = "grid";
        before.innerText = text;
        after.innerText = out;

        fill.style.width = "100%";
        fill.style.background = "#3b82f6";

        addHistory("Improve", "done");
    }
}

</script>

</body>
</html>
