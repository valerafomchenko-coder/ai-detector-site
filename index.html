<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI SaaS</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
}

textarea {
    width: 100%;
    height: 180px;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 16px;
}

button {
    margin: 6px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

button:disabled {
    background: #334155;
    cursor: not-allowed;
}

.row {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.card {
    flex: 1;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
    min-height: 120px;
}

.small {
    color: #94a3b8;
    font-size: 13px;
}

.history {
    margin-top: 20px;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
}

.item {
    padding: 8px;
    border-bottom: 1px solid #1f2937;
    cursor: pointer;
}

.item:hover {
    background: #1f2937;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>Humanly AI SaaS</h1>
    <div>
        <button onclick="setLang('ru')">RU</button>
        <button onclick="setLang('en')">EN</button>
    </div>
</div>

<p class="small" id="subtitle"></p>

<textarea id="text"></textarea>

<div class="small" id="counter"></div>

<div>
<button id="btnDetect" onclick="detect()"></button>
<button id="btnHumanize" onclick="humanize()"></button>
<button onclick="clearText()">Clear</button>
</div>

<div class="row">
    <div class="card">
        <h3 id="resultTitle"></h3>
        <p id="resultText"></p>
    </div>

    <div class="card">
        <h3>History</h3>
        <div id="history"></div>
    </div>
</div>

</div>

<script>

let lang = "ru";
let requests = 0;
const LIMIT = 20;

const dict = {
    ru: {
        subtitle: "SaaS платформа детектора и гуманизации текста",
        detect: "Проверить",
        humanize: "Очеловечить",
        chars: "Символов",
        words: "Слов",
        ai: "Оценка ИИ",
        result: "Результат"
    },
    en: {
        subtitle: "SaaS platform for AI detection and humanization",
        detect: "Analyze",
        humanize: "Humanize",
        chars: "Chars",
        words: "Words",
        ai: "AI Score",
        result: "Result"
    }
};

function setLang(l){
    lang = l;
    render();
}

function render(){
    const d = dict[lang];

    document.getElementById("subtitle").innerText = d.subtitle;
    document.getElementById("btnDetect").innerText = d.detect;
    document.getElementById("btnHumanize").innerText = d.humanize;

    updateCounter();
}

function updateCounter(){
    let text = document.getElementById("text").value;
    let chars = text.length;
    let words = text.trim().split(/\s+/).filter(Boolean).length;

    const d = dict[lang];

    document.getElementById("counter").innerText =
        `${d.chars}: ${chars} | ${d.words}: ${words}`;
}

document.getElementById("text").addEventListener("input", updateCounter);

function checkLimit(){
    if(requests >= LIMIT){
        alert(lang === "ru"
            ? "Лимит запросов исчерпан (демо)"
            : "Request limit reached (demo)");
        return false;
    }
    requests++;
    return true;
}

function detect(){
    if(!checkLimit()) return;

    let text = document.getElementById("text").value;

    fetch("http://2.26.31.163:3000/detect", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    })
    .then(r => r.json())
    .then(data => {
        show(dict[lang].ai, data.score + "%");
        saveHistory("detect", text, data.score);
    });
}

function humanize(){
    if(!checkLimit()) return;

    let text = document.getElementById("text").value;

    fetch("http://2.26.31.163:3000/humanize", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    })
    .then(r => r.json())
    .then(data => {
        show(dict[lang].result, data.result);
        saveHistory("humanize", text, data.result);
    });
}

function show(title, text){
    document.getElementById("resultTitle").innerText = title;
    document.getElementById("resultText").innerText = text;
}

function clearText(){
    document.getElementById("text").value = "";
    updateCounter();
}

function saveHistory(type, input, output){
    let history = JSON.parse(localStorage.getItem("history") || "[]");

    history.unshift({
        type,
        input: input.slice(0, 80),
        output: String(output).slice(0, 80)
    });

    history = history.slice(0, 10);

    localStorage.setItem("history", JSON.stringify(history));
    renderHistory();
}

function renderHistory(){
    let history = JSON.parse(localStorage.getItem("history") || "[]");

    document.getElementById("history").innerHTML =
        history.map(h =>
            `<div class="item">
                <b>${h.type}</b><br/>
                ${h.input} → ${h.output}
            </div>`
        ).join("");
}

render();
renderHistory();

</script>

</body>
</html>
