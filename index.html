<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI 3.1</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

h1 {
    font-size: 42px;
}

textarea {
    width: 100%;
    height: 180px;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 16px;
    outline: none;
}

button {
    margin: 10px 5px 0 5px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.card {
    margin-top: 20px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
}

.small {
    color: #94a3b8;
    font-size: 14px;
    margin-top: 10px;
}

.bar {
    height: 10px;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.fill {
    height: 10px;
    width: 0%;
    background: #22c55e;
    transition: 0.4s;
}

.tabs {
    margin-top: 20px;
}

.tab {
    display: inline-block;
    padding: 10px 15px;
    margin: 5px;
    background: #1e293b;
    border-radius: 8px;
    cursor: pointer;
}

.tab.active {
    background: #3b82f6;
}

.controls {
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Humanly AI 3.1</h1>
<p class="small" id="subtitle">AI Text Detector + Humanizer</p>

<div class="tabs">
    <div class="tab active" onclick="setMode('detect', event)">Detect AI</div>
    <div class="tab" onclick="setMode('humanize', event)">Humanize</div>
</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<div class="small" id="counter">Символов: 0 | Слов: 0</div>

<div class="controls">
    <button onclick="run()" id="btnRun">Analyze</button>
    <button onclick="clearText()" id="btnClear">Очистить</button>
    <button onclick="copyResult()" id="btnCopy">Копировать</button>
    <button onclick="toggleLang()" id="btnLang">EN</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="resultTitle"></h2>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="resultText"></p>
</div>

</div>

<script>

let mode = "detect";
let lang = "ru";

const textarea = document.getElementById("text");

textarea.addEventListener("input", updateCounter);

function setMode(m, event) {
    mode = m;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");
}

function updateCounter() {
    let text = textarea.value;

    let chars = text.length;

    let words = text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    document.getElementById("counter").innerText =
        lang === "ru"
        ? `Символов: ${chars} | Слов: ${words}`
        : `Chars: ${chars} | Words: ${words}`;
}

function clearText() {
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
    updateCounter();
}

function copyResult() {
    let text = document.getElementById("resultText").innerText;
    navigator.clipboard.writeText(text);
}

function toggleLang() {
    lang = lang === "ru" ? "en" : "ru";

    document.getElementById("title").innerText =
        lang === "ru" ? "Humanly AI 3.1" : "Humanly AI 3.1";

    document.getElementById("subtitle").innerText =
        lang === "ru"
        ? "AI Text Detector + Humanizer"
        : "AI Text Detector + Humanizer Tool";

    document.getElementById("btnRun").innerText =
        lang === "ru" ? "Analyze" : "Run";

    document.getElementById("btnClear").innerText =
        lang === "ru" ? "Очистить" : "Clear";

    document.getElementById("btnCopy").innerText =
        lang === "ru" ? "Копировать" : "Copy";

    document.getElementById("btnLang").innerText =
        lang === "ru" ? "EN" : "RU";

    updateCounter();
}

function analyzeText(text) {

    let score = 50;

    const aiPhrases = [
        "however", "moreover", "in conclusion",
        "it is important to note", "furthermore"
    ];

    aiPhrases.forEach(p => {
        if (text.toLowerCase().includes(p)) score += 8;
    });

    let sentences = text.split(".");
    let avgLen = text.length / (sentences.length || 1);

    if (avgLen > 120) score += 10;
    if (avgLen < 40) score -= 5;

    let words = text.toLowerCase().split(/\s+/);
    let unique = new Set(words);
    let diversity = unique.size / words.length;

    if (diversity < 0.55) score += 15;

    if (score > 95) score = 95;
    if (score < 5) score = 5;

    return Math.round(score);
}

function humanizeText(text) {

    return text
        .replace(/however/gi, "но")
        .replace(/moreover/gi, "к тому же")
        .replace(/in conclusion/gi, "в итоге")
        .replace(/it is important to note/gi, "важно понимать что")
        .replace(/furthermore/gi, "и ещё")
        + "\n\n(переписано в более естественном стиле)";
}

function run() {

    let text = textarea.value;

    if (text.length < 10) return;

    let resultCard = document.getElementById("resultCard");
    resultCard.style.display = "block";

    if (mode === "detect") {

        let score = analyzeText(text);

        document.getElementById("resultTitle").innerText =
            lang === "ru" ? "AI вероятность" : "AI Probability";

        document.getElementById("resultText").innerText =
            score + "% AI-like text";

        document.getElementById("fill").style.width = score + "%";
        document.getElementById("fill").style.background =
            score > 70 ? "#ef4444" : "#22c55e";
    }

    if (mode === "humanize") {

        let result = humanizeText(text);

        document.getElementById("resultTitle").innerText =
            lang === "ru" ? "Результат" : "Humanized Text";

        document.getElementById("resultText").innerText = result;

        document.getElementById("fill").style.width = "100%";
        document.getElementById("fill").style.background = "#3b82f6";
    }
}

updateCounter();

</script>

</body>
</html>
