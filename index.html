<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI 3.3</title>

<style>
:root{
    --bg:#0b1220;
    --card:#111a2e;
    --text:#ffffff;
    --muted:#94a3b8;
    --primary:#3b82f6;
    --danger:#ef4444;
    --green:#22c55e;
}

body.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#475569;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    font-size:38px;
    margin-bottom:5px;
}

.small{
    color:var(--muted);
    font-size:14px;
}

textarea{
    width:100%;
    height:180px;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:none;
    background:var(--card);
    color:var(--text);
    font-size:15px;
    outline:none;
}

.panel{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:12px;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:var(--primary);
    color:white;
    font-size:14px;
}

button.secondary{ background:#334155; }
button.danger{ background:var(--danger); }

.card{
    margin-top:20px;
    padding:20px;
    background:var(--card);
    border-radius:12px;
}

.bar{
    height:10px;
    background:#334155;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.fill{
    height:10px;
    width:0%;
    background:var(--green);
    transition:0.4s;
}

.insights{
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:rgba(148,163,184,0.1);
    font-size:14px;
    color:var(--muted);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#000;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    opacity:0;
    transition:0.3s;
}
.toast.show{ opacity:1; }

.lang{
    margin-left:10px;
    background:#334155;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <div>
        <h1>Humanly AI 3.3</h1>
        <div class="small">AI Detector + Explanation Engine</div>
    </div>

    <div>
        <button class="secondary" onclick="toggleTheme()">🌙</button>
        <button class="lang" onclick="toggleLang()" id="langBtn">EN</button>
    </div>
</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<div class="small" id="counter">0 символов | 0 слов</div>

<div class="panel">
    <button onclick="run()">Analyze</button>
    <button class="danger" onclick="clearText()">Очистить</button>
    <button class="secondary" onclick="copyResult()">Копировать</button>
    <button class="secondary" onclick="pasteText()">Вставить</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="resultTitle"></h2>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p id="resultText"></p>

    <div class="insights" id="insights"></div>
</div>

</div>

<div class="toast" id="toast">OK</div>

<script>

let lang = "ru";
const textarea = document.getElementById("text");

textarea.addEventListener("input", updateCounter);

const t = {
    ru:{
        analyze:"Анализ",
        clear:"Очистить",
        copy:"Копировать",
        paste:"Вставить",
        result:"AI вероятность",
        counter:(c,w)=>`${c} символов | ${w} слов`,
        insights:"Почему такой результат:"
    },
    en:{
        analyze:"Analyze",
        clear:"Clear",
        copy:"Copy",
        paste:"Paste",
        result:"AI Score",
        counter:(c,w)=>`${c} chars | ${w} words`,
        insights:"Why this score:"
    }
};

function toggleLang(){
    lang = lang === "ru" ? "en" : "ru";
    document.getElementById("langBtn").innerText = lang === "ru" ? "EN" : "RU";
    updateCounter();
}

function updateCounter(){
    let text = textarea.value;
    let chars = text.length;
    let words = text.trim() ? text.trim().split(/\s+/).length : 0;

    document.getElementById("counter").innerText =
        t[lang].counter(chars, words);
}

function clearText(){
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
    updateCounter();
}

function copyResult(){
    navigator.clipboard.writeText(
        document.getElementById("resultText").innerText
    );
}

function pasteText(){
    navigator.clipboard.readText().then(txt=>{
        textarea.value = txt;
        updateCounter();
    });
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

function analyze(text){

    let score = 50;
    let reasons = [];

    const bad = ["however","moreover","in conclusion","furthermore"];

    let lower = text.toLowerCase();

    bad.forEach(p=>{
        if(lower.includes(p)){
            score += 10;
            reasons.push("Detected formal AI phrase: " + p);
        }
    });

    let sentences = text.split(".");
    let avgLen = text.length / (sentences.length || 1);

    if(avgLen > 120){
        score += 10;
        reasons.push("Long sentence structure");
    }

    let words = lower.split(/\s+/);
    let unique = new Set(words);
    let diversity = unique.size / words.length;

    if(diversity < 0.55){
        score += 15;
        reasons.push("Low word diversity (repetition)");
    }

    if(words.length > 0 && diversity > 0.7){
        score -= 5;
        reasons.push("High natural variation");
    }

    score = Math.max(5, Math.min(95, Math.round(score)));

    return {score, reasons};
}

function run(){

    let text = textarea.value;
    if(text.length < 10) return;

    let result = analyze(text);

    document.getElementById("resultCard").style.display = "block";

    document.getElementById("resultTitle").innerText = t[lang].result;
    document.getElementById("resultText").innerText =
        result.score + "% AI-like text";

    document.getElementById("fill").style.width = result.score + "%";
    document.getElementById("fill").style.background =
        result.score > 70 ? "var(--danger)" : "var(--green)";

    document.getElementById("insights").innerHTML =
        "<b>" + t[lang].insights + "</b><br><br>" +
        result.reasons.map(r => "• " + r).join("<br>");
}

updateCounter();

</script>

</body>
</html>
