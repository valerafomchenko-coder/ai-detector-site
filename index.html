<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

h1{
    font-size:34px;
}

textarea{
    width:100%;
    height:180px;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    border:none;
    background:#111a2e;
    color:white;
    font-size:15px;
}

button{
    margin-top:10px;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#3b82f6;
    color:white;
}

.card{
    margin-top:20px;
    padding:20px;
    background:#111a2e;
    border-radius:12px;
}

.split{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.box{
    background:rgba(255,255,255,0.05);
    padding:10px;
    border-radius:10px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>Humanly AI</h1>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<br/>

<button onclick="improve()">✨ Improve Text</button>

<div class="card" id="resultCard" style="display:none;">
    <h2 id="title"></h2>

    <div class="split" id="split" style="display:none;">
        <div class="box" id="before"></div>
        <div class="box" id="after"></div>
    </div>

</div>

</div>

<script>

const textEl = document.getElementById("text");

async function improve(){

    let text = textEl.value;
    if(text.length < 5) return;

    document.getElementById("resultCard").style.display = "block";
    document.getElementById("title").innerText = "Thinking...";

    try {

        let res = await fetch("https://YOUR-SERVER.DE/humanize", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text })
        });

        let data = await res.json();

        document.getElementById("split").style.display = "grid";
        document.getElementById("before").innerText = text;
        document.getElementById("after").innerText = data.result;

        document.getElementById("title").innerText = "AI Improved Text";

    } catch (e) {
        document.getElementById("title").innerText = "Error (server not reachable)";
    }
}

</script>

</body>
</html>
