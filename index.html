<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AI SaaS Detector</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

textarea {
  width: 100%;
  height: 160px;
  padding: 10px;
  border-radius: 8px;
}

button {
  padding: 10px 14px;
  margin: 5px 5px 0 0;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.primary { background: #3b82f6; color: white; }
.gray { background: #374151; color: white; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#result {
  margin-top: 15px;
  font-size: 18px;
  white-space: pre-wrap;
}

.history-item {
  background: #1f2937;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <h2 id="title">AI SaaS Detector</h2>
  <button class="gray" onclick="toggleLang()" id="langBtn">EN</button>
</div>

<div class="card">

<textarea id="text"></textarea>

<br>

<button class="primary" onclick="detect()" id="btnDetect">Проверить текст</button>
<button class="primary" onclick="humanize()" id="btnHuman">Очеловечить</button>
<button class="gray" onclick="clearText()" id="btnClear">Очистить</button>
<button class="gray" onclick="copyResult()" id="btnCopy">Копировать</button>

<div id="result"></div>

</div>

<div class="card">
<h3 id="histTitle">История</h3>
<div id="history"></div>
</div>

</div>

<script>

const API = "/api";

let lang = "ru";
let history = JSON.parse(localStorage.getItem("history") || "[]");

const dict = {
  ru: {
    title: "AI Детектор",
    detect: "Проверить текст",
    human: "Очеловечить",
    clear: "Очистить",
    copy: "Копировать",
    history: "История",
    low: "Низкий AI",
    mid: "Средний AI",
    high: "Высокий AI"
  },
  en: {
    title: "AI Detector",
    detect: "Check text",
    human: "Humanize",
    clear: "Clear",
    copy: "Copy",
    history: "History",
    low: "Low AI",
    mid: "Medium AI",
    high: "High AI"
  }
};

function applyLang() {
  document.getElementById("title").innerText = dict[lang].title;
  document.getElementById("btnDetect").innerText = dict[lang].detect;
  document.getElementById("btnHuman").innerText = dict[lang].human;
  document.getElementById("btnClear").innerText = dict[lang].clear;
  document.getElementById("btnCopy").innerText = dict[lang].copy;
  document.getElementById("histTitle").innerText = dict[lang].history;
  document.getElementById("langBtn").innerText = lang === "ru" ? "EN" : "RU";
}

function toggleLang() {
  lang = lang === "ru" ? "en" : "ru";
  applyLang();
}

function saveHistory(text, result) {
  history.unshift({ text, result });
  history = history.slice(0, 10);
  localStorage.setItem("history", JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById("history");
  box.innerHTML = "";

  history.forEach(h => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerText = h.text.slice(0, 60) + " → " + h.result;
    div.onclick = () => {
      document.getElementById("text").value = h.text;
    };
    box.appendChild(div);
  });
}

function scoreLabel(score) {
  if (score < 40) return dict[lang].low;
  if (score < 70) return dict[lang].mid;
  return dict[lang].high;
}

async function detect() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/detect", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  const result = scoreLabel(data.score) + " (" + data.score + ")";

  document.getElementById("result").innerText = result;
  saveHistory(text, result);
}

async function humanize() {
  const text = document.getElementById("text").value;

  const res = await fetch(API + "/humanize", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  document.getElementById("result").innerText = data.result;
  saveHistory(text, "humanized");
}

function clearText() {
  document.getElementById("text").value = "";
  document.getElementById("result").innerText = "";
}

function copyResult() {
  navigator.clipboard.writeText(document.getElementById("result").innerText);
}

applyLang();
renderHistory();

</script>

</body>
</html>
