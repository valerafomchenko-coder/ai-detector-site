<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Humanly AI</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

h1 {
    font-size: 40px;
}

textarea {
    width: 100%;
    height: 180px;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 16px;
}

button {
    margin: 8px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.card {
    margin-top: 20px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
    text-align: left;
}

.small {
    color: #94a3b8;
    font-size: 14px;
}

.lang {
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title">Humanly AI</h1>
<p class="small" id="subtitle">AI Detector + Humanizer</p>

<div class="lang">
<button onclick="setLang('ru')">RU</button>
<button onclick="setLang('en')">EN</button>
</div>

<textarea id="text" placeholder="Вставь текст..."></textarea>

<div class="small" id="counter">Символов: 0 | Слов: 0</div>

<br/>

<button onclick="detect()">Analyze AI</button>
<button onclick="humanize()">Humanize</button>
<button onclick="clearText()">Очистить</button>
<button onclick="copyText()">Копировать</button>

<div class="card" id="resultCard" style="display:none;">
    <h3 id="resultTitle"></h3>
    <p id="resultText"></p>
</div>

</div>

<script>

let lang = "ru";

const textarea = document.getElementById("text");
textarea.addEventListener("input", updateCounter);

function updateCounter(){
    let text = textarea.value;
    let chars = text.length;
    let words = text.trim().split(/\s+/).filter(Boolean).length;

    document.getElementById("counter").innerText =
        (lang === "ru"
            ? "Символов: " + chars + " | Слов: " + words
            : "Chars: " + chars + " | Words: " + words);
}

function setLang(l){
    lang = l;

    document.getElementById("title").innerText =
        l === "ru" ? "Humanly AI" : "Humanly AI";

    document.getElementById("subtitle").innerText =
        l === "ru" ? "Детектор + Очеловечивание текста" : "AI Detector + Humanizer";
}

function detect(){
    fetch("http://2.26.31.163:3000/detect", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: textarea.value})
    })
    .then(r => r.json())
    .then(data => {
        show("AI Score", data.score + "%");
    });
}

function humanize(){
    fetch("http://2.26.31.163:3000/humanize", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: textarea.value})
    })
    .then(r => r.json())
    .then(data => {
        show("Humanized", data.result);
    });
}

function show(title, text){
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("resultTitle").innerText = title;
    document.getElementById("resultText").innerText = text;
}

function clearText(){
    textarea.value = "";
    document.getElementById("resultCard").style.display = "none";
    updateCounter();
}

function copyText(){
    navigator.clipboard.writeText(
        document.getElementById("resultText").innerText
    );
}

</script>

</body>
</html>
